services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: pratocheio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pratocheio}
      POSTGRES_DB: pratocheio
      POSTGRES_TEST_PASSWORD: ${POSTGRES_TEST_PASSWORD:-pratocheio_test}
    ports:
      # 5433 no local
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pratocheio -d pratocheio"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://pratocheio:${POSTGRES_PASSWORD:-pratocheio}@db:5432/pratocheio
    ports:
      - "${PORT:-3000}:3000"

volumes:
  pgdata:
